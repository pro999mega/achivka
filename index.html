<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050608" />
<title>ACHIEVEMENT TERMINAL</title>
<style>
:root{
  --bg:#050608;
  --cyan:#2ee6ff;
  --red:#ff3b30;
  --green:#37f5a0;
  --txt:#dfeef8;
  --mute:#7f97a6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
  padding:16px 14px calc(98px + env(safe-area-inset-bottom));
  background-image:radial-gradient(120% 70% at 50% -10%, rgba(46,230,255,.10), transparent 62%);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  opacity:.35;
}

/* ---------- шапка ---------- */
.hdr{padding:2px 2px 0;}
.hdr-row{display:flex;align-items:center;gap:12px;}
.hl{font-size:15px;font-weight:700;letter-spacing:.03em;color:var(--cyan);line-height:1.3;word-break:break-word;}
.hl .num{color:var(--red);}
.hs{font-size:11px;color:var(--mute);margin-top:7px;letter-spacing:.02em;}
.avatar{
  margin-left:auto;flex:0 0 auto;width:64px;height:64px;border-radius:17px;
  border:1px solid rgba(46,230,255,.35);
  background:linear-gradient(160deg,rgba(46,230,255,.14),rgba(6,10,13,.92));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 0 26px rgba(46,230,255,.10), inset 0 0 18px rgba(46,230,255,.07);
}
.avatar b{font-size:23px;color:#fff;line-height:1;}
.avatar small{font-size:8px;color:var(--mute);letter-spacing:.18em;}
.hr-rule{height:1px;background:linear-gradient(90deg,var(--cyan),rgba(46,230,255,.04));margin:14px 0 10px;}
.htags{font-size:9px;letter-spacing:.16em;color:rgba(127,151,166,.9);}

/* ---------- экраны ---------- */
.screen{display:none;padding-top:16px;}
.screen.on{display:block;}
.sec-title{font-size:11px;letter-spacing:.16em;color:var(--cyan);margin:0 0 12px 2px;}

.panel{
  position:relative;border:1px solid rgba(46,230,255,.16);border-radius:20px;
  padding:18px 16px;
  background:linear-gradient(180deg,rgba(11,18,23,.92),rgba(5,8,10,.92));
}
.corners::before,.corners::after{
  content:"";position:absolute;width:18px;height:18px;border:1px solid rgba(46,230,255,.5);pointer-events:none;
}
.corners::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:8px 0 0 0;}
.corners::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 8px 0;}

.lvl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px;}
.lvl-name{font-size:9px;letter-spacing:.18em;color:var(--mute);}
.lvl-big{font-size:26px;color:#fff;letter-spacing:.04em;margin-top:6px;}
.reward{text-align:right;}
.reward b{display:block;font-size:19px;color:var(--green);}
.reward small{font-size:8px;letter-spacing:.16em;color:var(--mute);}

.prog-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--mute);margin-bottom:8px;}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(46,230,255,.14);overflow:hidden;}
.fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#0f7f96,var(--cyan) 62%,#c8fbff);
  box-shadow:0 0 14px rgba(46,230,255,.55);
  transition:width .42s cubic-bezier(.2,.9,.2,1);
}

.act{
  margin-top:18px;width:100%;border-radius:22px;border:1px solid rgba(46,230,255,.45);
  padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:linear-gradient(180deg,rgba(46,230,255,.16),rgba(46,230,255,.04));
  color:#fff;font-family:inherit;cursor:pointer;user-select:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 10px 30px rgba(46,230,255,.10);
  transition:transform .09s ease, box-shadow .2s ease, background .25s ease, border-color .25s ease;
  animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 0 10px rgba(46,230,255,.10);}
  50%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 0 26px rgba(46,230,255,.32);}
}
.act:active{transform:scale(.985);}
.act-main{font-size:19px;letter-spacing:.22em;font-weight:700;color:#eafcff;}
.act-sub{font-size:10px;letter-spacing:.1em;color:var(--mute);}
.act.paid{
  animation:none;border-color:rgba(55,245,160,.6);
  background:linear-gradient(180deg,rgba(55,245,160,.24),rgba(55,245,160,.05));
  box-shadow:0 0 30px rgba(55,245,160,.32);
}
.act.paid .act-main{color:var(--green);letter-spacing:.1em;}
.act.paid .act-sub{color:rgba(55,245,160,.8);}

.stats{display:flex;gap:10px;margin-top:14px;}
.stat{
  flex:1;border:1px solid rgba(46,230,255,.13);border-radius:16px;padding:12px 12px 11px;
  background:rgba(9,14,18,.8);
}
.stat .k{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--mute);}
.stat .v{display:block;font-size:17px;color:#fff;margin-top:6px;}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.tbl-wrap{
  margin-top:16px;border:1px solid rgba(46,230,255,.13);border-radius:16px;overflow:hidden;
  background:rgba(9,14,18,.78);
}
table{width:100%;border-collapse:collapse;font-size:11px;}
th,td{padding:11px 10px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.06);word-break:break-word;}
th{font-size:8.5px;letter-spacing:.13em;color:var(--mute);font-weight:400;background:rgba(46,230,255,.05);}
tr:last-child td{border-bottom:0;}
td.sum{color:var(--green);white-space:nowrap;}
td.st{color:var(--mute);}
td.st.paid{color:rgba(55,245,160,.7);}
td.empty{text-align:center;color:var(--mute);padding:20px 10px;letter-spacing:.1em;}

.clear{
  margin-top:16px;width:100%;border-radius:18px;padding:17px;cursor:pointer;
  border:1px solid rgba(255,59,48,.5);
  background:linear-gradient(180deg,rgba(255,59,48,.16),rgba(255,59,48,.04));
  color:#ffd9d6;font-family:inherit;font-size:12px;letter-spacing:.1em;
  transition:background .2s ease, border-color .2s ease;
}
.clear.armed{
  border-color:#ff3b30;color:#fff;
  background:linear-gradient(180deg,rgba(255,59,48,.34),rgba(255,59,48,.1));
  box-shadow:0 0 24px rgba(255,59,48,.35);
}
.clear:disabled{opacity:.45;border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--mute);box-shadow:none;}
.ghost{
  margin-top:10px;width:100%;background:none;border:0;color:rgba(127,151,166,.7);
  font-family:inherit;font-size:10px;letter-spacing:.14em;padding:10px;cursor:pointer;
}

/* ---------- тост и табы ---------- */
.toast{
  position:fixed;top:14px;left:50%;z-index:30;
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:12px;font-size:11px;letter-spacing:.12em;
  border:1px solid rgba(46,230,255,.5);background:#071016;color:var(--cyan);
  box-shadow:0 8px 28px rgba(0,0,0,.6);
  transition:opacity .22s ease, transform .22s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,6,8,0),rgba(5,6,8,.97) 42%);
}
.tab{
  flex:1;padding:14px 10px;border-radius:16px;cursor:pointer;
  border:1px solid rgba(46,230,255,.16);background:rgba(8,12,16,.9);
  color:var(--mute);font-family:inherit;font-size:11px;letter-spacing:.16em;
  transition:color .2s ease, background .2s ease;
}
.tab.on{
  color:#04121a;font-weight:700;border-color:transparent;
  background:linear-gradient(180deg,#7df3ff,var(--cyan));
  box-shadow:0 0 22px rgba(46,230,255,.32);
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-row">
    <div>
      <div class="hl"><span class="num">01//</span> ACHIEVEMENT TERMINAL</div>
      <div class="hs">ачивка · прокачка нажатиями</div>
    </div>
    <div class="avatar"><b id="avLvl">01</b><small>LVL</small></div>
  </div>
  <div class="hr-rule"></div>
  <div class="htags">CLICK PROTOCOL // LEVEL SYSTEM // REWARD &#8381;</div>
</header>

<section class="screen on" id="scrMain">
  <div class="panel corners">
    <div class="lvl-top">
      <div>
        <div class="lvl-name">ТЕКУЩИЙ УРОВЕНЬ</div>
        <div class="lvl-big" id="lvlBig">УР. 01</div>
      </div>
      <div class="reward">
        <b id="rewVal">+1 &#8381;</b>
        <small>НАГРАДА</small>
      </div>
    </div>
    <div class="prog-top"><span id="pText">0 / 1</span><span id="pPct">0%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="act" id="btn">
      <span class="act-main">НАЖАТЬ</span>
      <span class="act-sub">нажми, когда сделал задание</span>
    </button>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">К ВЫВОДУ</span><span class="v" id="pend">0 &#8381;</span></div>
    <div class="stat"><span class="k">ВСЕГО НАЧИСЛЕНО</span><span class="v" id="tot">0 &#8381;</span></div>
  </div>
</section>

<section class="screen" id="scrStats">
  <div class="sec-title">02// СВОДКА И ВЫПЛАТЫ</div>
  <div class="grid4">
    <div class="stat"><span class="k">К ВЫВОДУ</span><span class="v" id="cPend">0 &#8381;</span></div>
    <div class="stat"><span class="k">СЕГОДНЯ</span><span class="v" id="cToday">0 &#8381;</span></div>
    <div class="stat"><span class="k">ВСЕГО</span><span class="v" id="cTot">0 &#8381;</span></div>
    <div class="stat"><span class="k">ВЫПЛАЧЕНО</span><span class="v" id="cPaid">0 &#8381;</span></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>УРОВЕНЬ</th><th>СУММА</th><th>ДАТА</th></tr></thead>
      <tbody id="tBody"></tbody>
    </table>
  </div>
  <button class="clear" id="btnClear">ЗАБРАЛ · ОЧИСТИТЬ</button>
  <button class="ghost" id="btnReset">сбросить весь прогресс</button>
</section>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <button class="tab on" data-scr="main">ТЕРМИНАЛ</button>
  <button class="tab" data-scr="stats">СВОДКА</button>
</nav>

<script>
(function(){
  "use strict";
  var KEY = "achivka_v1";
  var DEF = { level:1, presses:0, entries:[], totalEarned:0, withdrawn:0 };
  var S = load();
  var lock = false, clearArmed = false, armTimer = null, flashTimer = null;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return { level:1, presses:0, entries:[], totalEarned:0, withdrawn:0 };
      var p = JSON.parse(raw) || {};
      return {
        level: Math.max(1, parseInt(p.level,10) || 1),
        presses: Math.max(0, parseInt(p.presses,10) || 0),
        entries: Array.isArray(p.entries) ? p.entries.filter(function(e){ return e && e.lv && e.sum; }) : [],
        totalEarned: Number(p.totalEarned) || 0,
        withdrawn: Number(p.withdrawn) || 0
      };
    }catch(e){ return { level:1, presses:0, entries:[], totalEarned:0, withdrawn:0 }; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function el(id){ return document.getElementById(id); }
  function pad(n){ n = String(n); return n.length < 2 ? "0" + n : n; }
  function money(n){ return Number(n).toLocaleString("ru-RU") + " \u20BD"; }
  function pending(){
    return S.entries.reduce(function(a,e){ return a + (e.paid ? 0 : e.sum); }, 0);
  }
  function todaySum(){
    var d = new Date();
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    return S.entries.reduce(function(a,e){ return a + ((e.t || 0) >= start ? e.sum : 0); }, 0);
  }
  function when(t){
    if(!t) return "\u2014";
    var d = new Date(t);
    return pad(d.getDate()) + "." + pad(d.getMonth()+1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function buzz(p){
    try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
  }
  function flash(txt){
    var t = el("toast");
    t.textContent = txt;
    t.classList.add("on");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }

  function render(){
    var need = S.level, p = Math.min(S.presses, need);
    var pct = Math.round(p / need * 100);

    el("avLvl").textContent  = pad(S.level);
    el("lvlBig").textContent = "\u0423\u0420. " + pad(S.level);
    el("rewVal").textContent = "+" + S.level + " \u20BD";
    el("pText").textContent  = p + " / " + need;
    el("pPct").textContent   = pct + "%";
    el("fill").style.width   = pct + "%";
    el("pend").textContent   = money(pending());
    el("tot").textContent    = money(S.totalEarned);

    el("cPend").textContent  = money(pending());
    el("cToday").textContent = money(todaySum());
    el("cTot").textContent   = money(S.totalEarned);
    el("cPaid").textContent  = money(S.withdrawn);

    var tb = el("tBody");
    var rows = S.entries.slice().reverse();
    if(!rows.length){
      tb.innerHTML = '<tr><td colspan="3" class="empty">пока нет начислений</td></tr>';
    }else{
      tb.innerHTML = rows.map(function(e){
        return '<tr><td>\u0423\u0420. ' + pad(e.lv) + '</td>' +
               '<td class="sum">+' + e.sum + ' \u20BD</td>' +
               '<td class="st' + (e.paid ? ' paid' : '') + '">' + when(e.t) +
               (e.paid ? ' \u00B7 \u0432\u044B\u043F\u043B\u0430\u0447\u0435\u043D\u043E' : '') + '</td></tr>';
      }).join("");
    }

    var b = el("btnClear");
    if(!clearArmed){
      var pd = pending();
      b.classList.remove("armed");
      b.disabled = pd <= 0;
      b.textContent = pd > 0 ? "\u0417\u0410\u0411\u0420\u0410\u041B \u00B7 \u041E\u0427\u0418\u0421\u0422\u0418\u0422\u042C \u00B7 " + money(pd)
                             : "\u0417\u0410\u0411\u0420\u0410\u041B \u00B7 \u041E\u0427\u0418\u0421\u0422\u0418\u0422\u042C";
    }
  }

  function press(){
    if(lock) return;
    lock = true;
    buzz(10);

    S.presses++;

    if(S.presses >= S.level){
      /* уровень закрыт */
      var lv = S.level;

      el("fill").style.width = "100%";
      el("pText").textContent = lv + " / " + lv;
      el("pPct").textContent = "100%";

      S.entries.push({ lv: lv, sum: lv, t: Date.now(), paid: false });
      S.totalEarned = (Number(S.totalEarned) || 0) + lv;
      S.level = lv + 1;
      S.presses = 0;
      save();

      el("pend").textContent = money(pending());
      el("tot").textContent  = money(S.totalEarned);
      el("avLvl").textContent = pad(S.level);
      el("lvlBig").textContent = "\u0423\u0420. " + pad(S.level);
      el("rewVal").textContent = "+" + S.level + " \u20BD";

      var btn = el("btn");
      btn.classList.add("paid");
      btn.querySelector(".act-main").textContent = "+" + lv + " \u20BD";
      btn.querySelector(".act-sub").textContent  = "\u0443\u0440\u043E\u0432\u0435\u043D\u044C " + pad(lv) + " \u0437\u0430\u043A\u0440\u044B\u0442";

      buzz([20,50,20,50,30]);

      setTimeout(function(){
        btn.classList.remove("paid");
        btn.querySelector(".act-main").textContent = "\u041D\u0410\u0416\u0410\u0422\u042C";
        btn.querySelector(".act-sub").textContent  = "\u043D\u0430\u0436\u043C\u0438, \u043A\u043E\u0433\u0434\u0430 \u0441\u0434\u0435\u043B\u0430\u043B \u0437\u0430\u0434\u0430\u043D\u0438\u0435";
        render();
        lock = false;
        flash("+" + money(lv) + " \u00B7 \u0443\u0440\u043E\u0432\u0435\u043D\u044C " + pad(lv));
      }, 1000);

    }else{
      save();
      render();
      setTimeout(function(){ lock = false; }, 160);
    }
  }

  function armClear(){
    if(pending() <= 0) return;
    if(clearArmed){ doClear(); return; }
    clearArmed = true;
    var b = el("btnClear");
    b.classList.add("armed");
    b.textContent = "\u041F\u041E\u0414\u0422\u0412\u0415\u0420\u0414\u0418: " + money(pending());
    buzz(12);
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){
      clearArmed = false;
      render();
    }, 4500);
  }

  function doClear(){
    var s = pending();
    if(s <= 0) return;
    S.entries.forEach(function(e){ if(!e.paid) e.paid = true; });
    S.withdrawn = (Number(S.withdrawn) || 0) + s;
    clearArmed = false;
    clearTimeout(armTimer);
    save();
    render();
    buzz([18,40,18]);
    flash("\u041E\u0427\u0418\u0429\u0415\u041D\u041E \u00B7 " + money(s));
  }

  function resetAll(){
    if(!confirm("\u0421\u0431\u0440\u043E\u0441\u0438\u0442\u044C \u0432\u0435\u0441\u044C \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0441: \u0443\u0440\u043E\u0432\u0435\u043D\u044C, \u043D\u0430\u0436\u0430\u0442\u0438\u044F \u0438 \u0432\u0441\u0435 \u043D\u0430\u0447\u0438\u0441\u043B\u0435\u043D\u0438\u044F?")) return;
    S = { level:1, presses:0, entries:[], totalEarned:0, withdrawn:0 };
    clearArmed = false;
    save();
    render();
    flash("\u041F\u0420\u041E\u0413\u0420\u0415\u0421\u0421 \u0421\u0411\u0420\u041E\u0428\u0415\u041D");
  }

  /* подписки */
  el("btn").addEventListener("click", press);
  el("btnClear").addEventListener("click", armClear);
  el("btnReset").addEventListener("click", resetAll);

  var tabs = document.querySelectorAll(".tab");
  for(var i = 0; i < tabs.length; i++){
    tabs[i].addEventListener("click", function(){
      for(var k = 0; k < tabs.length; k++) tabs[k].classList.remove("on");
      this.classList.add("on");
      var target = this.getAttribute("data-scr") === "stats" ? "scrStats" : "scrMain";
      el("scrMain").classList.remove("on");
      el("scrStats").classList.remove("on");
      el(target).classList.add("on");
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
